<!DOCTYPE html>
<!--
  求职项目雷达 · 报告模板（dashboard 版）
  把 id="report-data" 的 script 标签内容替换成报告 JSON，其余不要改。
  单文件，无外部依赖。用 scripts/render_report.py 渲染。

  数据结构：
  {
    "meta": {"target_role","jd_keywords":[],"stack":[],"time_budget","env_constraints",
             "searched_at","queries":[],"sources":[],"weight_note"},
    "funnel": {"pool","hard_rejected","scored","recommended"},
    "weights": {"ai_core":35,"novelty":10,"timeliness":15,"onboarding":15,"stars":10,"business":15},
    "candidates": [{
      "repo","url","stars","pushed_at","days_since_push","license","language","topics":[],
      "platform":"github|gitee", "gvp":false, "renamed_from":"旧仓库名（可选）",
      "stars_per_month":123, "releases_90d":3,
      "track":"runnable|source-reading", "tier":"A|B|watch",
      "product_form":"product|library|infra|unknown",   // 缺省 product；library/infra 会被校验拦下
      "scores":{"ai_core","novelty","timeliness","onboarding","stars","business"},
      "evidence":{同上六个键},
      "summary":"一句话说清这是什么项目",
      "pitch":"立项动机",
      "core_tech":[{"name","desc"}],
      "challenges":[{"problem","solution"}],
      "onboarding":[], "risks":[], "signals":[], "verified":true,
      "tutorial_heavy":false            // 可选，缺省时从 risks 文本推断
    }],
    "rejected":[{"repo","url","reason"}],
    "unverified":[{"repo","url","note"}]
  }
-->
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>求职项目雷达</title>
<style>
:root{
  --canvas:#f4f3f1; --surface:#fff; --surface-2:#faf9f7; --overlay:#fbfaf8;
  --line:#e9e6e1; --line-2:#f2efeb; --scrim:rgba(20,18,16,.42);
  --ink:#0f0e0d; --ink-2:#5b5651; --ink-3:#9a938b;
  --blue:#2563eb; --blue-deep:#1e3a8a; --blue-mid:#60a5fa; --blue-soft:#e8effd;
  --rose:#db2777; --rose-soft:#fdeef5;
  --amber:#f59e0b; --amber-soft:#fef4e2;
  --emerald:#059669; --emerald-soft:#e6f5ef;
  --violet:#7c3aed; --violet-soft:#f1ebfe;
  --cyan:#0891b2; --cyan-soft:#e4f4f8;
  --sh1:0 1px 2px rgba(16,14,13,.04), 0 10px 28px -18px rgba(16,14,13,.30);
  --sh2:0 2px 6px rgba(16,14,13,.06), 0 22px 48px -26px rgba(16,14,13,.38);
  --mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,monospace;
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  --r:20px; --nav:264px;
}
*{box-sizing:border-box}
*{scrollbar-width:thin;scrollbar-color:#cfc9c1 var(--surface-2)}
::-webkit-scrollbar{width:11px;height:11px}
::-webkit-scrollbar-track{background:var(--surface-2);border-radius:8px}
::-webkit-scrollbar-thumb{background:#cfc9c1;border-radius:8px;border:3px solid var(--surface-2)}
::-webkit-scrollbar-thumb:hover{background:var(--blue-mid)}
::-webkit-scrollbar-thumb:active{background:var(--blue)}
::-webkit-scrollbar-corner{background:var(--surface-2)}
html{scroll-behavior:smooth}
body{margin:0;background:var(--canvas);color:var(--ink);font:14px/1.6 var(--sans);-webkit-font-smoothing:antialiased}
a{color:var(--blue);text-decoration:none}
a:hover{text-decoration:underline}
button{font:inherit;color:inherit;cursor:pointer}
.banner{margin:24px;padding:16px 18px;border-radius:14px;background:var(--rose-soft);
  border:1px solid #f3cfe0;color:#9d174d;font-size:14px}

/* ---------- shell ---------- */
.shell{display:grid;grid-template-columns:var(--nav) minmax(0,1fr);min-height:100vh}
.side{position:sticky;top:0;height:100vh;display:flex;flex-direction:column;
  background:var(--canvas);padding:20px 16px 14px;gap:14px;overflow-y:auto;z-index:40}
.brand{display:flex;align-items:center;gap:10px;padding:2px 6px 0}
.mark{width:30px;height:30px;border-radius:10px;flex:none;
  background:linear-gradient(140deg,var(--blue) 0%,var(--violet) 52%,var(--amber) 100%);
  box-shadow:0 4px 12px -4px rgba(37,99,235,.6);position:relative}
.mark::after{content:"";position:absolute;inset:8px;border-radius:4px;
  border:2px solid rgba(255,255,255,.92);border-bottom-color:transparent;border-right-color:transparent;
  transform:rotate(45deg)}
.brand b{font-size:15.5px;letter-spacing:-.01em}
.brand span{display:block;font-size:10.5px;color:var(--ink-3);font-weight:400;letter-spacing:.04em}
.search{display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line);
  border-radius:12px;padding:8px 10px;box-shadow:var(--sh1)}
.search svg{flex:none;color:var(--ink-3)}
.search input{border:0;outline:0;background:transparent;flex:1;min-width:0;font-size:13px}
.search kbd{font-family:var(--mono);font-size:10px;color:var(--ink-3);background:var(--surface-2);
  border:1px solid var(--line);border-radius:5px;padding:1px 5px}
.navgroup{display:flex;flex-direction:column;gap:2px}
.navlabel{font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3);
  padding:12px 10px 5px}
.nav{display:flex;align-items:center;gap:10px;padding:9px 11px;border-radius:11px;border:0;
  background:transparent;width:100%;text-align:left;font-size:13.5px;color:var(--ink-2);
  transition:background .16s,color .16s,transform .16s}
.nav:hover{background:var(--surface);color:var(--ink)}
.nav.on{background:var(--ink);color:#fff;box-shadow:var(--sh1)}
.nav.on .ico{color:#fff}
.nav .ico{flex:none;color:var(--ink-3);display:flex}
.nav .lbl{flex:1}
.nav .cnt{font-family:var(--mono);font-size:11px;color:var(--ink-3)}
.nav.on .cnt{color:rgba(255,255,255,.7)}
.nav .dot{width:17px;height:17px;border-radius:9px;background:var(--amber);color:#fff;
  font-size:10px;font-family:var(--mono);display:grid;place-items:center}
.sidefoot{margin-top:auto;display:flex;flex-direction:column;gap:2px;padding-top:10px}
.me{display:flex;align-items:center;gap:10px;padding:10px;margin-top:8px;border-top:1px solid var(--line)}
.av{width:30px;height:30px;border-radius:50%;flex:none;display:grid;place-items:center;color:#fff;
  font-size:12px;font-weight:600;background:linear-gradient(140deg,var(--blue-deep),var(--violet))}
.me .who{min-width:0}
.me b{display:block;font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.me span{display:block;font-size:11px;color:var(--ink-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

.main{min-width:0;display:flex;flex-direction:column}
.top{position:sticky;top:0;z-index:30;background:rgba(244,243,241,.86);backdrop-filter:blur(14px);
  border-bottom:1px solid transparent;padding:22px 30px 16px;display:flex;align-items:flex-end;
  gap:18px;flex-wrap:wrap;transition:border-color .2s,box-shadow .2s}
.top.stuck{border-bottom-color:var(--line);box-shadow:0 8px 20px -20px rgba(16,14,13,.6)}
.top h1{margin:0;font-size:31px;line-height:1.15;letter-spacing:-.025em;font-weight:650}
.top .sub{font-size:12px;color:var(--ink-3);margin-top:4px}
.tools{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.chip{display:inline-flex;align-items:center;gap:7px;background:var(--surface);border:1px solid var(--line);
  border-radius:11px;padding:7px 12px;font-size:12.5px;color:var(--ink-2);box-shadow:var(--sh1);
  transition:transform .16s,box-shadow .16s,border-color .16s}
.chip:hover{transform:translateY(-1px);box-shadow:var(--sh2);border-color:#ddd8d1}
.chip.ghost{background:transparent;box-shadow:none;border-color:transparent;color:var(--ink-3)}
.chip b{color:var(--ink);font-weight:600}
.chip.act{cursor:pointer}
.burger{display:none;background:var(--surface);border:1px solid var(--line);border-radius:11px;
  width:36px;height:36px;place-items:center;box-shadow:var(--sh1)}
.content{padding:6px 30px 64px;min-width:0}

/* ---------- cards ---------- */
.grid{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:20px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);
  padding:24px 26px;box-shadow:var(--sh1);min-width:0;position:relative;
  animation:none}
.content.anim .card{animation:rise .5s cubic-bezier(.22,.9,.3,1) both;animation-delay:calc(var(--i,0)*55ms)}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.card.hov{transition:transform .2s,box-shadow .2s}
.card.hov:hover{transform:translateY(-2px);box-shadow:var(--sh2)}
.c4{grid-column:span 4}.c5{grid-column:span 5}.c6{grid-column:span 6}
.c7{grid-column:span 7}.c8{grid-column:span 8}.c12{grid-column:span 12}
.chead{display:flex;align-items:flex-start;gap:12px;margin-bottom:4px}
.chead h3{margin:0;font-size:16.5px;font-weight:640;letter-spacing:-.01em}
.chead .note{font-size:12px;color:var(--ink-3);margin-top:3px}
.chead .right{margin-left:auto;display:flex;align-items:center;gap:8px}
.link{font-size:12.5px;color:var(--ink-2);display:inline-flex;align-items:center;gap:4px;
  background:transparent;border:0;padding:2px 0}
.link:hover{color:var(--blue)}
.kpi{font-size:60px;line-height:1;letter-spacing:-.04em;font-weight:660;font-variant-numeric:tabular-nums;
  margin:16px 0 12px}
.kpi small{font-size:20px;font-weight:500;color:var(--ink-3);letter-spacing:0}
.delta{display:inline-flex;align-items:center;gap:5px;border-radius:9px;padding:3px 9px;
  font-size:12px;font-family:var(--mono);border:1px solid var(--line)}
.delta.up{background:var(--emerald-soft);color:#046c4e;border-color:#c9e8db}
.delta.down{background:var(--rose-soft);color:#9d174d;border-color:#f3cfe0}
.delta.flat{background:var(--surface-2);color:var(--ink-2)}
.lede{font-size:13px;color:var(--ink-2);margin:14px 0 0;max-width:46ch}
.track{height:9px;border-radius:6px;background:var(--surface-2);position:relative;overflow:hidden;margin-top:16px}
.track i{position:absolute;inset:0 auto 0 0;border-radius:6px;
  background:repeating-linear-gradient(115deg,var(--blue) 0 5px,var(--blue-mid) 5px 10px);
  width:0;transition:width 1s cubic-bezier(.22,.9,.3,1)}
.track u{position:absolute;top:-4px;bottom:-4px;width:2px;background:var(--ink);border-radius:2px}
.scale{display:flex;justify-content:space-between;font-size:11px;color:var(--ink-3);
  font-family:var(--mono);margin-top:7px}
.rows{margin-top:18px;border-top:1px solid var(--line-2)}
.row{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line-2);font-size:13px}
.row:last-child{border-bottom:0}
.row .k{color:var(--ink-2)}
.row .v{margin-left:auto;font-family:var(--mono);font-weight:600;font-variant-numeric:tabular-nums}

/* hero */
.hero{border:0;color:#fff;overflow:hidden;padding:26px 26px 24px;
  background:
    radial-gradient(120% 90% at 8% 4%, #1d4ed8 0%, rgba(29,78,216,0) 58%),
    radial-gradient(100% 80% at 96% 96%, #f59e0b 0%, rgba(245,158,11,0) 56%),
    radial-gradient(90% 70% at 88% 12%, #7c3aed 0%, rgba(124,58,237,0) 60%),
    linear-gradient(158deg,#1e3a8a 0%,#2563eb 42%,#0891b2 100%);
  box-shadow:0 2px 6px rgba(30,58,138,.2),0 26px 54px -28px rgba(30,58,138,.75)}
.hero::after{content:"";position:absolute;right:-40px;bottom:-60px;width:230px;height:230px;
  border-radius:34px;border:26px solid rgba(255,255,255,.13);transform:rotate(22deg);pointer-events:none}
.hero .htag{display:inline-flex;align-items:center;gap:6px;background:rgba(255,255,255,.18);
  border:1px solid rgba(255,255,255,.26);border-radius:9px;padding:4px 10px;font-size:11.5px;
  backdrop-filter:blur(6px)}
.hero .pager{position:absolute;top:26px;right:26px;font-size:11.5px;font-family:var(--mono);opacity:.85}
.hero .big{font-size:52px;line-height:1;letter-spacing:-.035em;font-weight:680;margin:20px 0 4px;
  font-variant-numeric:tabular-nums}
.hero .big em{font-style:normal;font-size:16px;font-weight:500;opacity:.85;margin-left:8px;letter-spacing:0}
.hero h4{margin:14px 0 8px;font-size:19px;line-height:1.35;font-weight:640;letter-spacing:-.01em;max-width:22ch}
.hero p{margin:0;font-size:12.5px;line-height:1.65;opacity:.9;max-width:34ch}
.hero .cta{margin-top:20px;display:inline-flex;align-items:center;gap:8px;background:#fff;color:var(--ink);
  border:0;border-radius:12px;padding:9px 15px;font-size:13px;font-weight:600;box-shadow:0 6px 18px -8px rgba(0,0,0,.5);
  transition:transform .16s}
.hero .cta:hover{transform:translateY(-1px)}
/* 三条洞察一次性全渲染，叠在同一个网格单元里，靠 class 交叉淡入。
   轮播只切 class，不重建 DOM。之前每 7.6 秒整页 innerHTML 重写一次，
   入场动画重放、滚动位置重置、输入焦点丢失，看起来就是闪刷。
   同格叠放让容器高度自动取最高一条，切换时卡片不跳高。 */
.hero .slides{display:grid}
.hero .slide{grid-area:1/1;opacity:0;visibility:hidden;pointer-events:none;
  transition:opacity .42s ease,transform .42s ease;transform:translateY(6px)}
.hero .slide.on{opacity:1;visibility:visible;pointer-events:auto;transform:none}
.dots{display:flex;gap:6px;margin-top:18px}
.dots button{width:22px;height:4px;border-radius:3px;border:0;background:rgba(255,255,255,.32);padding:0;
  transition:background .2s,width .2s}
.dots button.on{background:#fff;width:34px}

/* needs-you */
.todo{display:flex;align-items:center;gap:12px;width:100%;background:transparent;border:0;
  padding:13px 0;border-bottom:1px solid var(--line-2);text-align:left;transition:padding-left .18s}
.todo:last-child{border-bottom:0}
.todo:hover{padding-left:5px}
.todo .ic{width:32px;height:32px;border-radius:11px;flex:none;display:grid;place-items:center}
.todo .tx{flex:1;min-width:0}
.todo b{display:block;font-size:13px;font-weight:600}
.todo span{display:block;font-size:11.5px;color:var(--ink-3);margin-top:2px}
.todo .ar{color:var(--ink-3);flex:none}

/* charts */
.chart{width:100%;overflow:visible}
.chart text{font-family:var(--sans)}
.axis{font-size:10.5px;fill:var(--ink-3);font-family:var(--mono)}
.wlab{font-size:12px;fill:var(--ink-2)}
.wval{font-size:11.5px;font-family:var(--mono);font-weight:600}
.legend{display:flex;flex-wrap:wrap;gap:12px;margin-top:14px}
.lg{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;color:var(--ink-2)}
.lg i{width:11px;height:11px;border-radius:3px;flex:none}
.insight{margin-top:18px;background:var(--surface-2);border:1px solid var(--line-2);border-radius:14px;padding:14px 16px}
.insight b{display:block;font-size:13px;margin-bottom:3px}
.insight span{font-size:12px;color:var(--ink-3)}

/* table */
.filters{display:flex;flex-wrap:wrap;gap:9px;align-items:center;margin-bottom:16px}
.seg{display:flex;background:var(--surface);border:1px solid var(--line);border-radius:11px;
  overflow:hidden;box-shadow:var(--sh1)}
.seg button{border:0;background:transparent;padding:7px 13px;font-size:12.5px;color:var(--ink-2);
  border-right:1px solid var(--line-2);transition:background .15s,color .15s}
.seg button:last-child{border-right:0}
.seg button.on{background:var(--ink);color:#fff}
select{font:12.5px var(--sans);padding:7px 11px;border:1px solid var(--line);border-radius:11px;
  background:var(--surface);color:var(--ink);box-shadow:var(--sh1);outline:0}
.tcount{margin-left:auto;font-size:11.5px;color:var(--ink-3);font-family:var(--mono)}
.tw{overflow-x:auto;border-radius:16px}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{padding:13px 14px;text-align:left;border-bottom:1px solid var(--line-2);vertical-align:middle}
th{font-size:10.5px;letter-spacing:.07em;text-transform:uppercase;color:var(--ink-3);font-weight:600;
  cursor:pointer;user-select:none;white-space:nowrap;background:var(--surface-2)}
th:first-child{border-radius:12px 0 0 0}th:last-child{border-radius:0 12px 0 0}
th:hover{color:var(--blue)}
th.num,td.num{text-align:right;font-family:var(--mono);white-space:nowrap;font-variant-numeric:tabular-nums}
tbody tr{transition:background .14s}
tbody tr:hover{background:var(--surface-2);cursor:pointer}
tbody tr:last-child td{border-bottom:0}
.pill{display:inline-grid;place-items:center;min-width:22px;height:22px;padding:0 7px;border-radius:8px;
  font-family:var(--mono);font-size:11.5px;font-weight:700}
.pill.A{background:var(--emerald-soft);color:#046c4e}
.pill.B{background:var(--blue-soft);color:var(--blue-deep)}
.pill.watch{background:var(--surface-2);color:var(--ink-3)}
.tag{display:inline-block;font-size:10.5px;font-family:var(--mono);padding:2px 7px;border-radius:6px;
  background:var(--blue-soft);color:var(--blue-deep);white-space:nowrap}
.tag.g{background:var(--emerald-soft);color:#046c4e}
.tag.n{background:var(--surface-2);color:var(--ink-2)}
.tag.a{background:var(--amber-soft);color:#92610a}
.tag.r{background:var(--rose-soft);color:#9d174d}
.spark{display:flex;gap:3px;align-items:flex-end;height:20px}
.spark i{width:6px;border-radius:2px;min-height:2px}

/* candidate */
.cand{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:26px 28px;
  box-shadow:var(--sh1);margin-bottom:20px;scroll-margin-top:110px;
  animation:none}
.content.anim .cand{animation:rise .5s cubic-bezier(.22,.9,.3,1) both;animation-delay:calc(var(--i,0)*45ms)}
.cand.A{border-top:3px solid var(--emerald)}
.cand.B{border-top:3px solid var(--blue)}
.cand.watch{border-top:3px solid var(--line)}
.ctop{display:flex;gap:26px;flex-wrap:wrap;align-items:flex-start}
.ctop .l{flex:1 1 340px;min-width:0}
.ctop h3{margin:0;font-size:20px;letter-spacing:-.015em;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.meta{font-family:var(--mono);font-size:11.5px;color:var(--ink-3);margin-top:8px;
  display:flex;flex-wrap:wrap;gap:4px 12px}
.summary{margin:16px 0 0;font-size:16px;line-height:1.55;font-weight:550;padding-left:14px;
  border-left:3px solid var(--blue)}
.summary em{display:block;font-style:normal;font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;
  color:var(--ink-3);font-weight:400;margin-bottom:4px}
.pitch{margin:12px 0 0;background:var(--blue-soft);border-radius:14px;padding:14px 16px;font-size:13.5px;line-height:1.7}
.pitch b{color:var(--blue-deep)}
.scorebox{text-align:center;flex:none}
.scorebox .n{font-size:44px;line-height:1;font-weight:680;letter-spacing:-.035em;font-variant-numeric:tabular-nums}
.scorebox .n small{font-size:14px;color:var(--ink-3);font-weight:500}
.blk{margin-top:24px}
.blk>.h{font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3);margin-bottom:12px}
.cs{display:grid;grid-template-columns:28px minmax(0,1fr);gap:0 12px;padding:9px 0}
.cs-n{font-family:var(--mono);font-size:11.5px;font-weight:700;color:var(--ink-3);text-align:right;padding-top:12px}
.pair{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.cell{border-radius:14px;padding:13px 15px;border:1px solid var(--line)}
.cell.q{background:var(--rose-soft);border-color:#f6d9e6}
.cell.a{background:var(--emerald-soft);border-color:#cfe8dd}
.ctag{display:inline-block;font-size:10.5px;font-weight:700;letter-spacing:.06em;padding:2px 8px;
  border-radius:6px;color:#fff;margin-bottom:7px}
.cell.q .ctag{background:var(--rose)}
.cell.a .ctag{background:var(--emerald)}
.cell p{margin:0;font-size:13px;line-height:1.68}
.cell.q p{color:#7d1440}
.cell.a p{color:#0a4a37}
.tech{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
.tc{background:var(--surface-2);border:1px solid var(--line-2);border-radius:14px;padding:14px 16px;
  border-top:3px solid var(--blue);transition:transform .18s,box-shadow .18s}
.tc:hover{transform:translateY(-2px);box-shadow:var(--sh1)}
.tc:nth-child(6n+2){border-top-color:var(--emerald)}
.tc:nth-child(6n+3){border-top-color:var(--violet)}

var DIMS=[
 ['ai_core','AI 核心技术占比','AI占比','#2563eb','路径体积 + 依赖清单双信号'],

  var s=0; DIMS.forEach(function(d){ s+=(+((c.scores||{})[d[0]])||0)*(+S.weights[d[0]]||0); });
  return Math.round(s/w*100)/100;

/* ---------- charts ---------- */
function hatch(id,color,op){
  return '<pattern id="'+id+'" width="7" height="7" patternTransform="rotate(45)" patternUnits="userSpaceOnUse">'
    +'<rect width="7" height="7" fill="'+color+'" opacity="'+(op||.14)+'"/>'
    +'<line x1="0" y1="0" x2="0" y2="7" stroke="'+color+'" stroke-width="3.4" opacity=".85"/></pattern>';
}
function waterfall(c){
  var W=520,rowH=38,padL=118,padR=64,top=26,H=top+rowH*7+34;
  var x=function(v){return padL+(W-padL-padR)*(v/5);};
  var defs='',body='',cum=0,prevX=x(0),prevY=top+rowH*0.5;
  DIMS.forEach(function(d,i){ defs+=hatch('wf'+i,d[3]); });
  body+='<text class="axis" x="'+padL+'" y="16">0</text>'
      + '<text class="axis" x="'+x(5)+'" y="16" text-anchor="end">5.0</text>';
  for(var g=0;g<=5;g++){
    body+='<line x1="'+x(g)+'" y1="'+(top-6)+'" x2="'+x(g)+'" y2="'+(top+rowH*6+10)+'" stroke="#f2efeb"/>';
  }
  DIMS.forEach(function(d,i){
    var v=+((c.scores||{})[d[0]])||0, add=v*(+S.weights[d[0]]||0)/(wsum()||1);
    var y=top+i*rowH+8, x0=x(cum), x1=x(cum+add), w=Math.max(3,x1-x0);
    body+='<text class="wlab" x="0" y="'+(y+15)+'">'+d[2]+'</text>'
      +'<line x1="'+prevX+'" y1="'+prevY+'" x2="'+x0+'" y2="'+(y+9)+'" stroke="#d9d4cc" stroke-dasharray="2 3"/>'
      +'<rect x="'+x0+'" y="'+y+'" width="'+w+'" height="18" rx="4" fill="url(#wf'+i+')"/>'
      +'<text class="wval" x="'+(x1+8)+'" y="'+(y+14)+'" fill="'+d[3]+'">+'+add.toFixed(2)+'</text>';
    cum+=add; prevX=x1; prevY=y+18;
  });
  var yA=top+6*rowH+10;
  body+='<line x1="'+prevX+'" y1="'+prevY+'" x2="'+x(cum)+'" y2="'+(yA+2)+'" stroke="#d9d4cc" stroke-dasharray="2 3"/>'
    +'<text class="wlab" x="0" y="'+(yA+17)+'" font-weight="700" fill="#0f0e0d">总分</text>'
    +'<rect x="'+x(0)+'" y="'+yA+'" width="'+Math.max(4,x(cum)-x(0))+'" height="22" rx="6" fill="#2563eb"/>'
    +'<text class="wval" x="'+(x(cum)+9)+'" y="'+(yA+16)+'" fill="#1e3a8a" font-size="13">'+cum.toFixed(2)+'</text>';
  return '<svg class="chart" viewBox="0 0 '+W+' '+H+'" role="img" aria-label="总分构成瀑布图">'+defs+body+'</svg>';
}
function distribution(list){
  var W=520,H=210,padB=40,padT=24,n=list.length||1;
  var bw=Math.min(34,(W-20)/n-10), gap=((W-20)-bw*n)/Math.max(1,n-1);
  var defs=hatch('dist','#60a5fa',.16),body='';
  body+='<line x1="0" y1="'+(H-padB)+'" x2="'+W+'" y2="'+(H-padB)+'" stroke="#e9e6e1"/>';
  var yT=padT+(H-padB-padT)*(1-4/5);
  body+='<line x1="0" y1="'+yT+'" x2="'+W+'" y2="'+yT+'" stroke="#cfc9c1" stroke-dasharray="4 4"/>'
      + '<text class="axis" x="'+(W-2)+'" y="'+(yT-6)+'" text-anchor="end">A 档线 4.0</text>';
  list.forEach(function(c,i){
    var h=(H-padB-padT)*Math.min(1,(c.total||0)/5), x=10+i*(bw+gap), y=H-padB-h;
    var isA=c.tier==='A';
    body+='<rect x="'+x+'" y="'+y+'" width="'+bw+'" height="'+Math.max(2,h)+'" rx="5" '
      +'fill="'+(isA?'#2563eb':'url(#dist)')+'"><title>'+esc(c.repo)+' '+c.total+'</title></rect>';
    if(isA) body+='<text class="axis" x="'+(x+bw/2)+'" y="'+(y-7)+'" text-anchor="middle" fill="#1e3a8a" font-weight="700">'+c.total.toFixed(2)+'</text>';
    body+='<text class="axis" x="'+(x+bw/2)+'" y="'+(H-padB+15)+'" text-anchor="middle" font-size="9">'
      +esc(short(c.repo).slice(0,7))+'</text>';
  });
  return '<svg class="chart" viewBox="0 0 '+W+' '+H+'" role="img" aria-label="候选总分分布">'+defs+body+'</svg>';
}
function radar(sc){
  var cx=118,cy=100,R=60,n=6,pts=[],grid='',axes='',labels='';
  for(var r=1;r<=5;r++){ var rp=[];
    for(var i=0;i<n;i++){ var a=-Math.PI/2+i*2*Math.PI/n, rr=R*r/5;
      rp.push((cx+rr*Math.cos(a)).toFixed(1)+','+(cy+rr*Math.sin(a)).toFixed(1)); }
    grid+='<polygon points="'+rp.join(' ')+'" fill="none" stroke="#eeeae4"/>'; }
  DIMS.forEach(function(d,i){
    var a=-Math.PI/2+i*2*Math.PI/n, ex=cx+R*Math.cos(a), ey=cy+R*Math.sin(a);
    axes+='<line x1="'+cx+'" y1="'+cy+'" x2="'+ex.toFixed(1)+'" y2="'+ey.toFixed(1)+'" stroke="#eeeae4"/>';
    var lx=cx+(R+18)*Math.cos(a), ly=cy+(R+18)*Math.sin(a);
    var an=Math.abs(Math.cos(a))<.3?'middle':(Math.cos(a)>0?'start':'end');
    labels+='<text x="'+lx.toFixed(1)+'" y="'+(ly+3).toFixed(1)+'" text-anchor="'+an+'" font-size="9.5" fill="'+d[3]+'">'+d[2]+'</text>';
    var v=Math.max(0,Math.min(5,+((sc||{})[d[0]])||0)), rr2=R*v/5;
    pts.push((cx+rr2*Math.cos(a)).toFixed(1)+','+(cy+rr2*Math.sin(a)).toFixed(1));
  });
  return '<svg viewBox="0 0 236 200" width="236" height="200" style="max-width:100%;height:auto" role="img" aria-label="六维雷达图">'
    +grid+axes+'<polygon points="'+pts.join(' ')+'" fill="rgba(37,99,235,.15)" stroke="#2563eb" stroke-width="1.8"/>'+labels+'</svg>';
}
function spark(sc){
  return '<span class="spark">'+DIMS.map(function(d){
    var v=+((sc||{})[d[0]])||0;
    return '<i style="height:'+(v/5*20).toFixed(1)+'px;background:'+d[3]+'" title="'+d[1]+' '+v+'"></i>';
  }).join('')+'</span>';
}

/* ---------- 检索过程 ---------- */
function spData(){return DATA.search_process||null;}
function spFrontier(){
  var sp=spData(); if(!sp) return [];
  var l=(sp.frontier||[]).slice();
  if(SP.origin!=='all') l=l.filter(function(f){return (f.origins||[]).indexOf(SP.origin)>=0;});
  if(SP.used!=='all') l=l.filter(function(f){return SP.used==='used'?f.used:!f.used;});
  if(SP.round!=='all') l=l.filter(function(f){return String(f.first_round)===String(SP.round);});
  if(SP.minIdf>0) l=l.filter(function(f){return (f.idf||0)>=SP.minIdf;});
  if(SP.q){var s=SP.q.toLowerCase(); l=l.filter(function(f){return f.term.toLowerCase().indexOf(s)>=0;});}
  l.sort(function(a,b){
    if(SP.sort==='idf') return (b.idf||0)-(a.idf||0);
    if(SP.sort==='df') return (b.df||0)-(a.df||0);
    if(SP.sort==='yield') return ((b.yield||{}).product||0)-((a.yield||{}).product||0);
    if(SP.sort==='raw') return (b.raw||0)-(a.raw||0);
    if(SP.sort==='term') return a.term.localeCompare(b.term);
    return (b.score||0)-(a.score||0);
  });
  return l;
}
function originTotals(sp){
  var t=sp.term_origins||{}, tot=0;
  Object.keys(t).forEach(function(k){tot+=t[k];});
  return {t:t,tot:tot||1};

    +'再按 IDF 与产出反馈排序进入下一轮查询。点图例可以只看某一来源的词。</span></div>';
}
function coverageChart(sp){
  var sat=(sp.coverage||{}).saturation||[]; if(!sat.length) return '';
  var W=520,H=210,pl=40,pr=44,pt=22,pb=34;
  var maxP=Math.max.apply(null,sat.map(function(s){return s.pool;}))||1;
  var maxF=Math.max.apply(null,sat.map(function(s){return s.frontier;}))||1;
  var n=sat.length, x=function(i){return pl+(W-pl-pr)*(n===1?0.5:i/(n-1));};
  var yP=function(v){return pt+(H-pt-pb)*(1-v/maxP);};
  var yF=function(v){return pt+(H-pt-pb)*(1-v/maxF);};
  var g='',lp='',lf='',dots='';
  for(var i=0;i<=4;i++){var yy=pt+(H-pt-pb)*i/4;
    g+='<line x1="'+pl+'" y1="'+yy+'" x2="'+(W-pr)+'" y2="'+yy+'" stroke="#f2efeb"/>';}
  sat.forEach(function(s,i){
    lp+=(i?' L':'M')+x(i).toFixed(1)+' '+yP(s.pool).toFixed(1);
    lf+=(i?' L':'M')+x(i).toFixed(1)+' '+yF(s.frontier).toFixed(1);
    dots+='<circle cx="'+x(i).toFixed(1)+'" cy="'+yP(s.pool).toFixed(1)+'" r="4.5" fill="#2563eb"/>'
      +'<circle cx="'+x(i).toFixed(1)+'" cy="'+yF(s.frontier).toFixed(1)+'" r="4" fill="#7c3aed"/>'
      +'<text class="axis" x="'+x(i).toFixed(1)+'" y="'+(H-pb+16)+'" text-anchor="middle">R'+s.round+'</text>'
      +'<text class="axis" x="'+x(i).toFixed(1)+'" y="'+(yP(s.pool)-10).toFixed(1)+'" text-anchor="middle" fill="#1e3a8a" font-weight="700">'+s.pool+'</text>'
      +'<text class="axis" x="'+x(i).toFixed(1)+'" y="'+(yF(s.frontier)-9).toFixed(1)+'" text-anchor="middle" fill="#5b21b6">'+s.frontier+'</text>';
  });
  var area=lp+' L'+x(n-1).toFixed(1)+' '+(H-pb)+' L'+x(0).toFixed(1)+' '+(H-pb)+' Z';
  return '<svg class="chart" viewBox="0 0 '+W+' '+H+'" role="img" aria-label="覆盖度增长曲线">'
    +'<defs>'+hatch('cov','#60a5fa',.14)+'</defs>'+g
    +'<path d="'+area+'" fill="url(#cov)"/>'
    +'<path d="'+lp+'" fill="none" stroke="#2563eb" stroke-width="2.4"/>'
    +'<path d="'+lf+'" fill="none" stroke="#7c3aed" stroke-width="2" stroke-dasharray="5 4"/>'
    +dots+'</svg>'
    +'<div class="legend"><span class="lg"><i style="background:#2563eb"></i>候选池</span>'
    +'<span class="lg"><i style="background:#7c3aed"></i>词前沿</span>'
    +'<span class="lg">新增率 '+sat.map(function(s){return 'R'+s.round+' '+Math.round(s.new_rate*100)+'%';}).join(' · ')+'</span></div>';
}
function topicGraph(sp){
  var edges=(sp.topic_graph_top||[]).slice(0,18); if(!edges.length) return '<div class="sub">本次没有 topic 共现数据。</div>';
  var cnt={};
  edges.forEach(function(e){var p=e.pair.split('|'); cnt[p[0]]=(cnt[p[0]]||0)+e.count; cnt[p[1]]=(cnt[p[1]]||0)+e.count;});
  var nodes=Object.keys(cnt).sort(function(a,b){return cnt[b]-cnt[a];}).slice(0,14);
  var W=520,H=330,cx=260,cy=165,R=118;
  var pos={};
  nodes.forEach(function(t,i){var a=-Math.PI/2+i*2*Math.PI/nodes.length;
    pos[t]={x:cx+R*Math.cos(a),y:cy+R*Math.sin(a),a:a};});
  var maxC=Math.max.apply(null,edges.map(function(e){return e.count;}))||1;
  var eg='',ng='';
  edges.forEach(function(e){
    var p=e.pair.split('|'), A=pos[p[0]], B=pos[p[1]]; if(!A||!B) return;
    var w=1+e.count/maxC*4.5;
    var mx=(A.x+B.x)/2, my=(A.y+B.y)/2;
    var qx=cx+(mx-cx)*0.34, qy=cy+(my-cy)*0.34;
    eg+='<path class="gedge" data-a="'+esc(p[0])+'" data-b="'+esc(p[1])+'" d="M'+A.x.toFixed(1)+' '+A.y.toFixed(1)
      +' Q'+qx.toFixed(1)+' '+qy.toFixed(1)+' '+B.x.toFixed(1)+' '+B.y.toFixed(1)
      +'" fill="none" stroke="#2563eb" stroke-opacity="'+(0.16+e.count/maxC*0.5).toFixed(2)
      +'" stroke-width="'+w.toFixed(1)+'"><title>'+esc(p[0])+' × '+esc(p[1])+' 共现 '+e.count+'</title></path>';
  });
  nodes.forEach(function(t){
    var P=pos[t], r=5+Math.min(9,cnt[t]/maxC*7);
    var lx=cx+(R+22)*Math.cos(P.a), ly=cy+(R+22)*Math.sin(P.a);
    var an=Math.abs(Math.cos(P.a))<.3?'middle':(Math.cos(P.a)>0?'start':'end');
    ng+='<circle class="gnode" data-node="'+esc(t)+'" cx="'+P.x.toFixed(1)+'" cy="'+P.y.toFixed(1)
      +'" r="'+r.toFixed(1)+'" fill="#1e3a8a"><title>'+esc(t)+' 累计共现 '+cnt[t]+'</title></circle>'
      +'<text class="glab" x="'+lx.toFixed(1)+'" y="'+(ly+3).toFixed(1)+'" text-anchor="'+an
      +'" fill="#5b5651">'+esc(t)+'</text>';
  });
  return '<svg class="chart" id="tgraph" viewBox="0 0 '+W+' '+H+'" role="img" aria-label="topic 共现图">'
    +eg+ng+'</svg>'
    +'<div class="insight"><b>共现图就是造词的依据</b><span>同一条边代表两个 topic 出现在同一个仓库上。'
    +'走这张图能拿到从没种过的邻居词，再把两个高分 topic 组合成没试过的查询。鼠标移到节点上会高亮它的边。</span></div>';
}

/* 渲染架构：外壳只建一次，之后只换 .content 的内容。
   之前每次状态变化都 app.innerHTML 重写整页，导致入场动画重放、
   滚动位置重置、搜索框焦点丢失，加上 7.6 秒的轮播定时器，就是持续闪刷。 */
var SHELL=false, LAST_VIEW=null, OPEN_FOLDS={}, QTIMER=null;
function render(opts){
  opts=opts||{};
  var viewChanged=(LAST_VIEW!==S.view);
  if(!SHELL){
    app.innerHTML=sidebar()+'<div class="main">'+topbar()+'<div class="content" id="content"></div></div>';
    SHELL=true; bindShell();
  }
  var content=document.getElementById('content');
  var y=window.scrollY;
  var anim=viewChanged||!!opts.anim;
  content.className='content'+(anim?' anim':'');
  content.innerHTML=body();
  patchShell(); bindContent(); restoreFolds(); animate(anim);
  if(viewChanged&&!opts.keepScroll) window.scrollTo(0,0);
  else if(window.scrollY!==y) window.scrollTo(0,y);
  LAST_VIEW=S.view;
}

function animate(withMotion){
  app.querySelectorAll('.track i[data-w]').forEach(function(el){
    var w=Math.min(100,+el.dataset.w)+'%';
    if(withMotion) requestAnimationFrame(function(){ el.style.width=w; });
    else { el.style.transition='none'; el.style.width=w; }
  });
  app.querySelectorAll('[data-count]').forEach(function(el){
    var target=+el.dataset.count, suffix=el.querySelector('small');
    var sfx=suffix?suffix.outerHTML:'';
    // 先落终值。隐藏标签页里 rAF 不触发，从 0 起动画会一直停在 0。
    el.innerHTML=target+sfx;
    if(!withMotion||document.visibilityState!=='visible') return;
    var t0=performance.now();
    function step(t){
      var k=Math.min(1,(t-t0)/700), e=1-Math.pow(1-k,3);
      el.innerHTML=Math.round(target*e)+sfx;
      if(k<1) requestAnimationFrame(step);
    }
    requestAnimationFrame(step);
  });
  var c=app.querySelector('#tcount');
  if(c) c.textContent=visible().length+' / '+C.length+' 个候选';
}

    el.innerHTML='权重合计 <b>'+sum+'</b> / 100'
      +(sum===100?'<span style="margin-left:auto;color:var(--ink-3)">口径正常</span>'
                 :'<span style="margin-left:auto">合计不等于 100，总分按占比归一化计算</span>'); }
  var p=document.getElementById('wpreview'); if(p) p.innerHTML=table(scored().sort(function(a,b){return b.total-a.total;}));
  var list=scored(), a=list.filter(function(c){return c.tier==='A';});
  var ins=app.querySelectorAll('.insight');
  ins.forEach(function(n){ if(/当前 A 档/.test(n.textContent)){
    n.innerHTML='<b>当前 A 档 '+a.length+' 个</b><span>'+esc(a.map(function(c){return short(c.repo);}).join('、')||'暂无')+'</span>'; } });
  var chip=app.querySelector('.tools .chip:nth-child(3)');
  if(chip) chip.innerHTML=ico(I.target,14)+'A 档 <b>'+a.length+'</b> / '+list.length;
  bindTables();
}
function bindTables(){
  app.querySelectorAll('[data-fold]').forEach(function(b){
    b.onclick=function(){
      var body=b.nextElementSibling;
      var open=body.hasAttribute('hidden');
      if(open) body.removeAttribute('hidden'); else body.setAttribute('hidden','');
      b.classList.toggle('on',open);
      OPEN_FOLDS[foldKeyOf(b)]=open;
    };
  });
  app.querySelectorAll('th[data-s]').forEach(function(th){
    th.onclick=function(){ S.sort=th.dataset.s; render({keepScroll:true}); };
  });
  app.querySelectorAll('tr[data-go]').forEach(function(tr){
    tr.onclick=function(){ goCandidate(tr.dataset.go); };
  });
}
function goCandidate(repo){
  S.view='candidates'; S.q=''; S.track='all'; S.tier='all'; render();
  requestAnimationFrame(function(){
    var el=document.getElementById('c-'+repo);
    if(el){ el.scrollIntoView({behavior:'smooth',block:'start'});
      el.style.boxShadow='0 0 0 3px rgba(37,99,235,.35),var(--sh2)';
      setTimeout(function(){ el.style.boxShadow=''; },1600); }
  });
}
function exportJSON(){
  var out=JSON.parse(JSON.stringify(DATA));
  out.weights=Object.assign({},S.weights);
  out.candidates=scored().map(function(c){
    var src=C.filter(function(x){return x.repo===c.repo;})[0]||{};
    var o=Object.assign({},src); o.total=c.total; o.tier=c.tier; return o;
  });
  out.meta=Object.assign({},out.meta,{weight_note:'导出时权重：'+DIMS.map(function(d){return d[1]+' '+S.weights[d[0]];}).join(' / ')
    +'。业务准入 '+(S.bizGate?'开':'关')+'，教程化降档 '+(S.tutorialGate?'开':'关')+'。'});
  out.funnel=Object.assign({},out.funnel,{recommended:out.candidates.filter(function(c){return c.tier==='A';}).length});
  var blob=new Blob([JSON.stringify(out,null,2)],{type:'application/json'});
  var a=document.createElement('a');
  a.href=URL.createObjectURL(blob); a.download='job-project-report-adjusted.json';
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  setTimeout(function(){URL.revokeObjectURL(a.href);},2000);
  toast('已导出当前权重下的报告数据');
}
function toast(msg){
  var t=document.createElement('div');
  t.textContent=msg;
  t.style.cssText='position:fixed;left:50%;bottom:30px;transform:translateX(-50%);background:#0f0e0d;color:#fff;'+
    'padding:11px 18px;border-radius:12px;font-size:13px;z-index:80;box-shadow:0 12px 32px -12px rgba(0,0,0,.7);opacity:0;transition:opacity .2s,transform .2s';
  document.body.appendChild(t);
  requestAnimationFrame(function(){t.style.opacity='1';t.style.transform='translateX(-50%) translateY(-4px)';});
  setTimeout(function(){t.style.opacity='0';setTimeout(function(){t.remove();},250);},2000);
}
function doAct(a,b){
  if(a==='export') return exportJSON();
  if(a==='reset'){ S.weights=Object.assign({},DEFAULTS); render({keepScroll:true}); return toast('已恢复默认权重 35/10/15/15/10/15'); }
  if(a==='random'){ DIMS.forEach(function(d){ S.weights[d[0]]=Math.round(Math.random()*8)*5; });
    if(wsum()===0) S.weights.ai_core=35; render({keepScroll:true}); return toast('随机了一组权重，合计 '+wsum()); }
  if(a==='even'){ DIMS.forEach(function(d){ S.weights[d[0]]=d[0]==='ai_core'?20:16; }); render({keepScroll:true}); return toast('已切到近似等权'); }
  if(a==='tech'){ S.weights={ai_core:45,novelty:10,timeliness:15,onboarding:15,stars:5,business:10}; render({keepScroll:true}); return toast('已切到技术优先'); }
  if(a==='weights'){ S.view='weights'; return render(); }
  if(a==='gate'){ S.tutorialGate=!S.tutorialGate; render({keepScroll:true}); return toast('教程化降档已'+(S.tutorialGate?'打开':'关闭')); }
  if(a==='divergence'){ S.view='candidates'; S.q=''; S.track='all'; S.tier='all'; S.platform='all'; render();
    return toast('分歧候选带 ai_band_divergence 标记，见卡片底部标签'); }
  if(a==='watch'){ S.view='candidates'; S.tier='watch'; S.track='all'; S.q=''; return render(); }
  if(a==='unverified'){ S.view='unverified'; return render(); }
  if(a==='focus'){ return goCandidate(b.dataset.repo); }
}
/* 外壳只绑一次。搜索框在侧栏里，若跟着内容一起重建，每敲一个字都会
   丢焦点并闪一下，所以侧栏永不重建，输入只驱动内容区更新。 */
function bindShell(){
  app.querySelectorAll('.side [data-view]').forEach(function(b){
    b.onclick=function(){ S.view=b.dataset.view; document.body.classList.remove('nav-open'); render(); };
  });
  app.querySelectorAll('.side [data-act], .top [data-act]').forEach(function(b){
    b.onclick=function(){ doAct(b.dataset.act,b); };
  });
  var q=document.getElementById('q');
  if(q) q.oninput=function(){
    S.q=q.value;
    clearTimeout(QTIMER);
    QTIMER=setTimeout(function(){
      if(S.view!=='candidates'&&S.view!=='challenges'){ S.view='candidates'; render(); }
      else render({keepScroll:true});
    },160);
  };
  var bg=document.getElementById('burger');
  if(bg) bg.onclick=function(){ document.body.classList.toggle('nav-open'); };
  var top=document.getElementById('top');
  if(top){ var onScroll=function(){ top.classList.toggle('stuck',window.scrollY>8); };
    window.addEventListener('scroll',onScroll,{passive:true}); onScroll(); }
}
function bindContent(){
  var content=document.getElementById('content');
  if(!content) return;
  content.querySelectorAll('[data-view]').forEach(function(b){
    b.onclick=function(){ S.view=b.dataset.view; render(); };
  });
  content.querySelectorAll('[data-hero]').forEach(function(b){
    b.onclick=function(){ setHero(+b.dataset.hero); };
  });
  content.querySelectorAll('[data-f]').forEach(function(b){
    b.onclick=function(){ S[b.dataset.f]=b.dataset.v; render({keepScroll:true}); };
  });
  content.querySelectorAll('[data-t]').forEach(function(b){
    b.onclick=function(){ S[b.dataset.t]=!S[b.dataset.t]; render({keepScroll:true});
      toast(b.dataset.t==='tutorialGate'?('教程化降档已'+(S.tutorialGate?'打开':'关闭')):('业务准入已'+(S.bizGate?'打开':'关闭'))); };
  });
  content.querySelectorAll('input[type=range][data-w]').forEach(function(r){
    r.oninput=function(){ S.weights[r.dataset.w]=+r.value; patchWeights(); };
  });
  var s=document.getElementById('sort');
  if(s) s.onchange=function(){ S.sort=s.value; render({keepScroll:true}); };
  content.querySelectorAll('[data-act]').forEach(function(b){
    b.onclick=function(){ doAct(b.dataset.act,b); };
  });
  bindTables();
  if(S.view==='search') bindSearch();
}
document.getElementById('scrim').onclick=function(){ document.body.classList.remove('nav-open'); };
document.addEventListener('keydown',function(e){
  if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==='k'){ e.preventDefault(); var q=document.getElementById('q'); if(q){q.focus();q.select();} }
  if(e.key==='Escape'){ document.body.classList.remove('nav-open'); }
});
var heroTimer=setInterval(function(){
  if(S.view!=='overview') return;
  var h=document.getElementById('hero');
  if(!h||h.matches(':hover')) return;
  if(document.visibilityState!=='visible') return;
  setHero(S.hero+1);
},7600);
window.addEventListener('beforeunload',function(){ clearInterval(heroTimer); });
render();
})();
</script>
</body>
</html>
